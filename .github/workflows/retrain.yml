# Retrain the model on the votes collected by the web app, then republish the site.
# Runs every Monday and can be started by hand (Actions tab > "Retrain on votes" > Run workflow).
# It does nothing until the SUPABASE_URL and SUPABASE_SECRET_KEY secrets are set in the repository.
name: Retrain on votes

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write # to commit the new model
  actions: write # to start the Pages deploy (pushes made with the default token do not trigger it)

env:
  MIN_VOTES: 50 # do not retrain on fewer vote events than this

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_SECRET_KEY are not set: nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"

      # Only what training and the export need; the CPU build of PyTorch is much smaller than the default.
      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          pip install numpy pandas httpx python-dotenv
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download the votes
        id: votes
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python src/pull_votes.py
          count=$(( $(wc -l < data/votes.csv) - 1 ))
          last=$(cat data/votes_count.txt 2>/dev/null || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt "$MIN_VOTES" ] || [ "$count" -eq "$last" ]; then
            echo "::notice::$count vote events (last retrained on $last, minimum $MIN_VOTES): nothing to do."
            echo "retrain=false" >> "$GITHUB_OUTPUT"
          else
            echo "retrain=true" >> "$GITHUB_OUTPUT"
          fi

      # --min-precision: if the new network is worse on unseen titles than this, nothing is saved and the run fails.
      - name: Train
        if: steps.votes.outputs.retrain == 'true'
        run: python src/train.py --min-precision 0.33

      - name: Rebuild the app data
        if: steps.votes.outputs.retrain == 'true'
        run: python src/export_app.py

      - name: Commit and publish
        if: steps.votes.outputs.retrain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ steps.votes.outputs.count }}" > data/votes_count.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/towers.npz data/votes_count.txt app/data.js app/facets.js
          git commit -m "chore: retrain the model on ${{ steps.votes.outputs.count }} collected vote events"
          git push
          gh workflow run pages.yml
